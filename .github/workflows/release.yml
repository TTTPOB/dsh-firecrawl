name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag belongs to main
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Verify exact version and refuse existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/check-release.mjs "$RELEASE_TAG"
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          if [ -n "$existing" ]; then
            echo "Release already exists; refusing to replace it or its assets." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Mocked tests only: no credentials or live Firecrawl calls.
      - run: pnpm run check
      - run: pnpm pack --pack-destination release-assets
      - name: Generate asset checksums
        run: |
          cd release-assets
          sha256sum *.tgz > SHA256SUMS
      # A failed upload leaves a draft for inspection, never a replaced asset.
      # Enable immutable releases in this repository before pushing a release tag.
      - name: Publish the new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
