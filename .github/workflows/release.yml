name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Verify exact version and refuse existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release.mjs "$RELEASE_TAG"
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          if [ -n "$existing" ]; then
            echo "Release already exists; refusing to replace it or its assets." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Mocked tests only: no credentials or live Firecrawl calls.
      - run: pnpm run check
      - run: pnpm pack --pack-destination release-assets
      # A failed upload leaves a draft for inspection, never a replaced asset.
      # Enable immutable releases in this repository before pushing a release tag.
      - name: Publish the new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.tgz --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
